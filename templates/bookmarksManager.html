<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks – Solar System Explorer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

<body class="search-body">
  <div class="container">
    <main>
      <h2>Saved Celestial Objects</h2>
      <div>All of your saved objects will appear here for easy access!</div>

      <ul class="bookmark-list">
        {% for obj in bookmarks %}
        <li class="bookmark-item" style="display: flex; align-items: center; gap: 10px;">
          <div class="orbit-container" onclick="window.location.href='{{ url_for('object_page', name=obj) }}'"
               style="cursor: pointer; flex-grow: 1; padding: 8px; background-color: #222; border-radius: 6px;">
            <span class="bookmark-title">{{ obj }}</span>
          </div>
          
          <button class="remove-btn" onclick="confirmRemoval(this)" style="padding: 6px 12px;">Remove</button>
        </li>
        {% endfor %}
      </ul>

      <button class="btn" onclick="window.location.href='{{ url_for('search_page') }}'">Back to Search</button>
    </main>
  </div>



  <script>
    function confirmRemoval(button) {
      const confirmed = confirm("Are you sure you want to remove this bookmark? \n*Removing bookmark will result in the loss of data");
      if (confirmed) {
        const item = button.closest('.bookmark-item');
        item.remove();

      }
    }
  </script>
</body>

</html>
