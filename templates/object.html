<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ obj.object.fullname }} – Solar System Explorer</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="search-body">

  <main>
    <div class="container">
      <h1>{{ obj.object.fullname }}</h1>

      <div class="orbit-container">
        <div class="section-title">Orbital Parameters</div>
        <ul class="orbital-list">
          {% if obj.orbit %}
          {% for el in obj.orbit.elements %}
          <li>
            <span class="label">{{ el.title }}:</span>
            <span class="value">{{ el.value }} {% if el.units %}{{ el.units }}{% endif %}</span>
          </li>
          {% endfor %}
          {% else %}
          <li>No orbital data available.</li>
          {% endif %}
        </ul>
      </div>

      <div>
        <button onclick="addBookmark('{{ obj.object.fullname }}')">Bookmark</button>
        <button class="btn" onclick="window.location.href='{{ url_for('search_page') }}'">Back to Search</button>
      </div>
  </main>

  <script>
    const modal = document.getElementById("helpModal");
    const btn = document.getElementById("helpBtn");
    const closeBtn = document.getElementById("closeModal");

    btn.onclick = () => modal.style.display = "block";
    closeBtn.onclick = () => modal.style.display = "none";
    window.onclick = e => { if (e.target == modal) modal.style.display = "none"; };

    function addBookmark(name) {
      alert(name + " added to bookmarks! (Demo)");
    }
  </script>

</body>

</html>
