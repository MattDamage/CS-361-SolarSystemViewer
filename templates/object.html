<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ obj.object.fullname }} – Solar System Explorer</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="search-body">

  <main>
    <div class="container">
      <h1>{{ obj.object.fullname }}</h1>

      <div class="orbit-container">
        <div class="section-title">Orbital Parameters</div>
        <ul class="orbital-list">
          {% if obj.orbit %}
          {% for el in obj.orbit.elements %}
          <li class="orbit-item"  data-title="{{ el.title }}"  data-value="{{ el.value }}" data-units="{{ el.units }}">
            
            <span class="label">{{ el.title }}:</span>
            <span class="value">{{ el.value }} {% if el.units %}{{ el.units }}{% endif %}</span>
          </li>
          {% endfor %}
          {% else %}
          <li>No orbital data available.</li>
          {% endif %}
        </ul>
      </div>
      

      <div>
        <button onclick="addBookmark('{{ obj.object.fullname }}')">Bookmark</button>
        <button class="btn" onclick="downloadPDF()">Download Report</button>
        <button onclick="convertAU()">Convert AU to km</button>
        <button class="btn" onclick="window.location.href='{{ url_for('search_page') }}'">Back to Search</button>
        
      </div>
  </main>

  <script>
    const modal = document.getElementById("helpModal");
    const btn = document.getElementById("helpBtn");
    const closeBtn = document.getElementById("closeModal");

    btn.onclick = () => modal.style.display = "block";
    closeBtn.onclick = () => modal.style.display = "none";
    window.onclick = e => { if (e.target == modal) modal.style.display = "none"; };

    function addBookmark(name) {
      alert(name + " added to bookmarks! (Demo)");
    }


    async function downloadPDF()
    {
      const response = await fetch('{{ url_for("pdf_service", name=obj.object.fullname) }}');
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${'{{ obj.object.fullname }}'}_report.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    }


    async function convertAU()
    {
      
      const items = document.querySelectorAll(".orbit-item");
      
      for (const li of items) 
      {
       

          const units = li.dataset.units;
          
          if (units !== "au") continue;
         
          const value = parseFloat(li.dataset.value);

        
          const resp = await fetch("/convert_au", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ value })
          });

          const data = await resp.json();

          // Update the display
          li.querySelector(".value").textContent = `${data.value} km`;

          // Update dataset so future conversions don't double-convert
          li.dataset.value = data.value;
          li.dataset.units = "km";
      }
    }


  </script>

</body>

</html>
