<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solar System Explorer – Search</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="search-body">
  <div class="container">
    <h1>Solar System Search</h1>

    <label for="search">Search:</label>

    <form action="{{ url_for('results_page') }}" method="get">
        <input type="text" name="q" id="search" placeholder="Search by IAU-recognized name or catalog code">
        <div class="note">
            Help: IAU name is the commonly agreed name (e.g., Jupiter or Io). Catalog code is the code (Jupiter I = Io, Jupiter’s first moon).
          </div>
        <button type="submit">Search</button>
    </form>

    <button class="bookmark-btn" onclick="window.location.href={{ url_for('bookmarks_page') }}'">Bookmarks</button>
  </div>
</body>
</html>
