<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks – Confirmation Demo</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('stars.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background-color: rgba(20, 20, 35, 0.85);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      text-align: center;
    }

    h1 {
      color: #9dc6ff;
      margin-bottom: 1.5rem;
    }

    ul.bookmark-list {
      list-style: none;
      padding: 0;
      margin: 1rem 0 2rem;
    }

    .bookmark-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(30,30,50,0.9);
      margin-bottom: 0.75rem;
      padding: 0.8rem 1rem;
      border-radius: 8px;
    }

    .bookmark-item a {
      color: #9dc6ff;
      text-decoration: none;
    }

    .bookmark-item button {
      background-color: #444;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      color: #f0f0f0;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .bookmark-item button:hover {
      background-color: #555;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.7);
    }

    .modal-content {
      background-color: rgba(20, 20, 35, 0.95);
      color: #e0e0e0;
      margin: 15% auto;
      padding: 2rem;
      border-radius: 12px;
      width: 300px;
      text-align: center;
      border: 1px solid #333;
    }

    .modal-content button {
      margin: 10px 5px 0 5px;
      width: 100px;
    }

    .modal-content .cancel-btn {
      background-color: #777;
    }

    .modal-content .cancel-btn:hover {
      background-color: #999;
    }

    .modal-content .confirm-btn {
      background-color: #b33;
    }

    .modal-content .confirm-btn:hover {
      background-color: #d55;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Bookmarks</h1>

    <ul class="bookmark-list">
      <li class="bookmark-item">
        <a href="pluto.html">Pluto</a>
        <button onclick="openModal(this)">Remove</button>
      </li>
      <li class="bookmark-item">
        <a href="charon.html">Charon</a>
        <button onclick="openModal(this)">Remove</button>
      </li>
    </ul>

    <button onclick="window.location.href='index.html'" style="padding: 8px 16px;">Back</button>
  </div>

  <!-- Modal -->
  <div id="confirmModal" class="modal">
    <div class="modal-content">
      <p>Are you sure you want to remove this bookmark?
	*Removing bookmark will result in the loss of data</p>
      <button class="confirm-btn" id="confirmBtn">Yes</button>
      <button class="cancel-btn" onclick="closeModal()">No</button>
    </div>
  </div>

  <script>
    let currentButton = null;
    const modal = document.getElementById("confirmModal");
    const confirmBtn = document.getElementById("confirmBtn");

    function openModal(button) {
      currentButton = button;
      modal.style.display = "block";
    }

    function closeModal() {
      modal.style.display = "none";
      currentButton = null;
    }

    confirmBtn.onclick = function() {
      if (currentButton) {
        // For paper demo: remove item visually
        const item = currentButton.parentElement;
        item.remove();
      }
      closeModal();
    }

    // Close modal if clicking outside content
    window.onclick = function(event) {
      if (event.target == modal) {
        closeModal();
      }
    }
  </script>

</body>
</html>
